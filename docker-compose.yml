services:
  veni:
    build: .
    image: veni-ai
    container_name: veni
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - veni_data:/home/veni/.veni-chatbot
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    working_dir: /workspace

  dashboard:
    build: .
    image: veni-ai
    container_name: veni-dashboard
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      - veni_data:/home/veni/.veni-chatbot
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    working_dir: /workspace
    entrypoint: ["veni", "dashboard"]
    restart: unless-stopped

  telegram:
    build: .
    image: veni-ai
    container_name: veni-telegram
    volumes:
      - .:/workspace
      - veni_data:/home/veni/.veni-chatbot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    working_dir: /workspace
    entrypoint: ["veni", "telegram"]
    restart: unless-stopped

volumes:
  veni_data:
