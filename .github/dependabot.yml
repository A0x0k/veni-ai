version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "pip"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
    groups:
      dev-dependencies:
        patterns:
          - "black"
          - "ruff"
          - "mypy"
          - "pytest*"
          - "bandit"
          - "pre-commit"
      core-dependencies:
        patterns:
          - "rich"
          - "typer"
          - "requests"
          - "pyyaml"
          - "prompt_toolkit"
          - "tiktoken"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(ci)"
