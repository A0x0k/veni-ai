site_name: Veni AI
site_description: Terminal-native AI assistant with multi-provider support, rich UI, and project-aware tooling
repo_url: https://github.com/neoastra303/Veni-AI
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - toc.follow

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Commands: commands.md
  - Providers: providers.md
  - Skills: skills.md
  - Personas: personas.md
  - Tools: tools.md
  - Architecture: architecture.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/neoastra303/Veni-AI

copyright: Copyright &copy; 2026 neoastra303
